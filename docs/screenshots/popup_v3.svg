<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 820" width="390" height="820">
  <!-- Dimmed background -->
  <rect x="2" y="2" width="386" height="816" rx="40" fill="#05070A" stroke="#232C38" stroke-width="2"/>
  <text x="32" y="32" fill="#5E6878" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600">00:22</text>
  <circle cx="195" cy="24" r="7" fill="#151B23"/>

  <!-- Quick Settings Tile Hint at top -->
  <rect x="24" y="62" width="166" height="62" rx="22" fill="#0D2820" stroke="#165B45"/>
  <circle cx="52" cy="93" r="14" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="52" cy="93" r="5" fill="#34D399"/>
  <text x="76" y="89" fill="#F3F6FA" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700">NFC Ключ</text>
  <text x="76" y="106" fill="#34D399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11">Активен • 8с</text>

  <rect x="200" y="62" width="166" height="62" rx="22" fill="#151B23" stroke="#232C38"/>
  <text x="220" y="98" fill="#5E6878" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600">Wi-Fi • Подключено</text>

  <!-- Floating 10-second Popup Card -->
  <rect x="20" y="216" width="350" height="366" rx="28" fill="#11151B" stroke="#232C38" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="252" fill="#34D399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700">Подносите к считывателю • 8с</text>
  <circle cx="336" cy="246" r="15" fill="#1D2430"/>
  <text x="336" y="251" text-anchor="middle" fill="#F3F6FA" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700">✕</text>

  <!-- Progress bar -->
  <rect x="40" y="268" width="310" height="5" rx="3" fill="#1B222C"/>
  <rect x="40" y="268" width="248" height="5" rx="3" fill="#34D399"/>

  <!-- Active Key Mini Hero -->
  <rect x="40" y="288" width="310" height="92" rx="20" fill="#0D2820" stroke="#165B45"/>
  <rect x="56" y="308" width="50" height="50" rx="14" fill="#10B981" fill-opacity="0.22"/>
  <circle cx="81" cy="333" r="8" fill="none" stroke="#34D399" stroke-width="2.2"/>
  <text x="120" y="330" fill="#F3F6FA" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="700">Подъезд</text>
  <text x="120" y="352" fill="#94A3B8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">UID 53:4D:AE:74 ⇄</text>

  <!-- Hardware status pill -->
  <rect x="40" y="394" width="310" height="40" rx="12" fill="#151B23" stroke="#165B45"/>
  <text x="54" y="419" fill="#34D399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600">✓ Активно в эфире: UID+SAK(28) = 53:4D:AE:74</text>

  <!-- Key Switch Chips -->
  <rect x="40" y="448" width="88" height="32" rx="10" fill="#0D2820" stroke="#165B45"/>
  <text x="84" y="468" text-anchor="middle" fill="#34D399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="600">Подъезд</text>
  <rect x="136" y="448" width="76" height="32" rx="10" fill="#151B23" stroke="#232C38"/>
  <text x="174" y="468" text-anchor="middle" fill="#8A94A6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12.5">Офис</text>
  <rect x="220" y="448" width="78" height="32" rx="10" fill="#151B23" stroke="#232C38"/>
  <text x="259" y="468" text-anchor="middle" fill="#8A94A6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12.5">Гараж</text>

  <!-- Bottom Equal Buttons -->
  <rect x="40" y="510" width="149" height="48" rx="12" fill="#0D2820" stroke="#165B45"/>
  <text x="114" y="539" text-anchor="middle" fill="#34D399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700">+10с</text>

  <rect x="201" y="510" width="149" height="48" rx="12" fill="#2B1215" stroke="#5C2228"/>
  <text x="275" y="539" text-anchor="middle" fill="#F87171" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700">Вернуть оплату</text>

  <rect x="135" y="800" width="120" height="4" rx="2" fill="#334155"/>
</svg>
